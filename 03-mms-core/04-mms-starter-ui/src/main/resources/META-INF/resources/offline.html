<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="#1676f3" name="theme-color">
    <title>Edyra Pilot - Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #172b4d;
            background: #f7f8fa;
        }

        body {
            box-sizing: border-box;
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }

        main {
            width: min(100%, 420px);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgb(23 43 77 / 8%);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #1676f3;
        }

        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main>
    <h1>You're offline</h1>
    <p>Mms can’t connect right now. Check your internet connection and try again.</p>
</main>
</body>
</html>
