        <path d="M5,30 C5,22 9,18 15,18 C21,18 25,22 25,30"/>
    </g>

    <!-- Icon 3: Lock -->
    <g class="form-icon" transform="translate(130, 10)">
        <rect x="5" y="15" width="20" height="15" rx="2"/>
        <path d="M9,15 L9,10 C9,6 11,4 15,4 C19,4 21,6 21,10 L21,15"/>
        <circle cx="15" cy="22" r="2" fill="#334155"/>
