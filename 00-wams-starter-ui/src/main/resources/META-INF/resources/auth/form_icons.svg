<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
    <defs>
        <style>
            .form-icon { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- Icon 1: School -->
    <g class="form-icon" transform="translate(10, 10)">
        <path d="M2,18 L15,5 L28,18"/>
