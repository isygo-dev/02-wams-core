<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
    <defs>
        <style>
            .desk { fill: #E2C792; }
            .laptop { fill: #B0BEC5; }
            .book { fill: #007B7F; }
            .figure-teal { fill: #007B7F; }
            .figure-blue { fill: #2196F3; }
            .figure-yellow { fill: #FFCA28; }
            .figure-skin { fill: #FFCCBC; }
            .bg-building { fill: #E0E0E0; opacity: 0.5; }
        </style>
    </defs>

    <!-- Background Building Silhouette -->
    <rect class="bg-building" x="300" y="100" width="250" height="250"/>
    <rect class="bg-building" x="350" y="50" width="100" height="50"/>

    <!-- Desk -->
    <rect class="desk" x="0" y="300" width="600" height="100"/>

    <!-- Figures (Abstract Shapes) -->
    <!-- Teacher (Left) -->
    <circle class="figure-skin" cx="150" cy="180" r="30"/>
    <path class="figure-teal" d="M120,300 Q150,210 180,300 Z"/>

    <!-- Student 1 (Far Left) -->
    <circle class="figure-skin" cx="70" cy="240" r="25"/>
    <path class="figure-blue" d="M30,350 Q70,260 110,350 Z"/>

    <!-- Student 2 (Middle Left) -->
    <circle class="figure-skin" cx="200" cy="270" r="25"/>
    <path class="figure-yellow" d="M160,350 Q200,290 240,350 Z"/>

    <!-- Student 3 (Middle Right) -->
    <circle class="figure-skin" cx="350" cy="240" r="28"/>
    <path class="figure-teal" d="M310,350 Q350,260 390,350 Z"/>

    <!-- Student 4 (Far Right) -->
    <circle class="figure-skin" cx="480" cy="250" r="25"/>
    <path class="figure-yellow" d="M440,350 Q480,280 520,350 Z"/>

    <!-- Laptop -->
    <rect class="laptop" x="250" y="280" width="120" height="70" rx="5"/>
    <rect class="laptop" x="240" y="350" width="140" height="10" rx="3"/>

    <!-- Stack of Books -->
    <rect class="book" x="400" y="330" width="80" height="15" rx="2"/>
    <rect class="book" x="410" y="345" width="80" height="15" rx="2"/>
    <rect class="book" x="395" y="360" width="80" height="15" rx="2"/>
</svg>