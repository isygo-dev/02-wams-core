<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
    <defs>
        <style>
            .input-box { fill: none; stroke: #CBD5E1; stroke-width: 2; }
            .input-icon { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- Input 1: School (With Dropdown) -->
    <rect class="input-box" x="0" y="0" width="500" height="60" rx="8"/>
    <g class="input-icon" transform="translate(20, 16)">
        <path d="M 4,18 L 14,8 L 24,18"/>
        <path d="M 6,18 L 6,28 L 22,28 L 22,18"/>
        <path d="M 11,28 L 11,22 L 17,22 L 17,28"/>
        <line x1="14" y1="5" x2="14" y2="8"/>
    </g>
    <!-- Chevron Down -->
    <path d="M 460,25 L 470,35 L 480,25" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Input 2: User -->
    <rect class="input-box" x="0" y="90" width="500" height="60" rx="8"/>
    <g class="input-icon" transform="translate(20, 106)">
        <circle cx="14" cy="10" r="6"/>
        <path d="M 4,28 C 4,20 8,16 14,16 C 20,16 24,20 24,28"/>
    </g>

    <!-- Input 3: Lock (With Eye) -->
    <rect class="input-box" x="0" y="180" width="500" height="60" rx="8"/>
    <g class="input-icon" transform="translate(20, 196)">
        <rect x="6" y="14" width="16" height="12" rx="2"/>
        <path d="M 10,14 L 10,10 C 10,6 12,4 14,4 C 16,4 18,6 18,10 L 18,14"/>
        <circle cx="14" cy="20" r="1.5" fill="#334155"/>
    </g>
    <!-- Eye Icon -->
    <g class="input-icon" transform="translate(460, 196)">
        <path d="M 2,14 C 2,14 8,4 16,4 C 24,4 30,14 30,14 C 30,14 24,24 16,24 C 8,24 2,14 2,14 Z"/>
        <circle cx="16" cy="14" r="4"/>
    </g>
</svg>