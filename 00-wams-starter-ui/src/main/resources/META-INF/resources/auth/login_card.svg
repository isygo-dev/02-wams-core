<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.08"/>
        </filter>
        <style>
            .card { fill: #FFFFFF; }
            .divider { stroke: #D1D5DB; stroke-width: 1.5; }
        </style>
    </defs>

    <!-- Card Background with Shadow -->
    <rect class="card" x="0" y="0" width="600" height="800" rx="20" filter="url(#shadow)"/>

    <!-- Top Divider (Under Logo) -->
    <line class="divider" x1="180" y1="160" x2="240" y2="160"/>
    <line class="divider" x1="360" y1="160" x2="420" y2="160"/>
    <!-- Center dot in divider -->
    <circle cx="300" cy="160" r="2.5" fill="#009B8D"/>

    <!-- Middle Divider (With User-Plus Icon) -->
    <line class="divider" x1="60" y1="590" x2="240" y2="590"/>
    <line class="divider" x1="360" y1="590" x2="540" y2="590"/>

    <!-- Bottom Divider -->
    <line class="divider" x1="60" y1="680" x2="540" y2="680"/>
</svg>