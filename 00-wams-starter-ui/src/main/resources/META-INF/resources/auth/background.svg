<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
    <defs>
        <!-- Faint Grid Pattern -->
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E5E0D8" stroke-width="1" opacity="0.4"/>
        </pattern>
        <!-- Light Teal Color -->
        <style>
            .bg-teal-light { fill: #B2DFDB; opacity: 0.6; }
            .bg-teal-med { fill: #80CBC4; opacity: 0.5; }
        </style>
    </defs>

    <!-- Base Cream Background -->
    <rect width="1600" height="900" fill="#FCF8F2"/>

    <!-- Grid Overlay -->
    <rect width="1600" height="900" fill="url(#grid)"/>

    <!-- Top Right Curved Shape -->
    <path class="bg-teal-light" d="M 800,0 C 1100,0 1300,150 1300,400 L 850,400 C 850,200 800,100 800,0 Z"/>

    <!-- Middle Right Shape -->
    <path class="bg-teal-med" d="M 1600,300 C 1400,300 1200,450 1200,600 L 1600,600 Z"/>

    <!-- Bottom Right Accent -->
    <path class="bg-teal-med" d="M 1600,700 C 1300,700 1000,850 1000,900 L 1600,900 Z"/>

    <!-- Bottom Left Accent -->
    <path class="bg-teal-med" d="M 0,800 C 150,800 250,850 250,900 L 0,900 Z"/>
</svg>