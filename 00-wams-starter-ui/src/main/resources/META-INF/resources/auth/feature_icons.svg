<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
    <defs>
        <style>
            .icon-circle { fill: #E0F2F1; }
            .icon-stroke { fill: none; stroke: #0B4A46; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .separator { stroke: #B2DFDB; stroke-width: 2; }
        </style>
    </defs>

    <!-- Icon 1: School -->
    <g transform="translate(30, 20)">
        <circle class="icon-circle" cx="40" cy="40" r="40"/>
        <g class="icon-stroke" transform="translate(20, 20)">
            <path d="M 5,20 L 20,5 L 35,20"/>
            <path d="M 8,20 L 8,35 L 32,35 L 32,20"/>
            <path d="M 15,35 L 15,25 L 25,25 L 25,35"/>
            <path d="M 20,5 L 20,0 L 28,-3"/>
        </g>
    </g>

    <!-- Separator 1 -->
    <line class="separator" x1="130" y1="30" x2="130" y2="90"/>

    <!-- Icon 2: Chart -->
    <g transform="translate(190, 20)">
        <circle class="icon-circle" cx="40" cy="40" r="40"/>
        <g class="icon-stroke" transform="translate(20, 20)">
            <path d="M 5,35 L 35,35"/>
            <rect x="8" y="22" width="6" height="13"/>
            <rect x="18" y="15" width="6" height="20"/>
            <rect x="28" y="10" width="6" height="25"/>
            <path d="M 10,18 L 20,10 L 30,2"/>
            <path d="M 25,2 L 30,2 L 30,7"/>
        </g>
    </g>

    <!-- Separator 2 -->
    <line class="separator" x1="290" y1="30" x2="290" y2="90"/>

    <!-- Icon 3: People -->
    <g transform="translate(350, 20)">
        <circle class="icon-circle" cx="40" cy="40" r="40"/>
        <g class="icon-stroke" transform="translate(20, 20)">
            <circle cx="20" cy="15" r="6"/>
            <path d="M 8,40 C 8,30 12,24 20,24 C 28,24 32,30 32,40"/>
            <circle cx="8" cy="22" r="4"/>
            <path d="M 0,40 C 0,33 4,28 10,28"/>
            <circle cx="32" cy="22" r="4"/>
            <path d="M 40,40 C 40,33 36,28 30,28"/>
        </g>
    </g>
</svg>