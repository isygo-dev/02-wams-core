<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
    <defs>
        <style>
            .btn-bg { fill: #009B8D; }
            .icon-stroke { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
            .btn-icon { fill: none; stroke: #FFFFFF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .separator { stroke: #CBD5E1; stroke-width: 1.5; }
        </style>
    </defs>

    <!-- Primary Button -->
    <rect class="btn-bg" x="0" y="0" width="500" height="60" rx="8"/>
    <!-- Button Arrow -->
    <g class="btn-icon" transform="translate(235, 20)">
        <line x1="0" y1="10" x2="25" y2="10"/>
        <polyline points="18,3 25,10 18,17"/>
    </g>

    <!-- User-Plus Icon (Middle of Divider) -->
    <g transform="translate(235, 80)">
        <g class="icon-stroke" transform="translate(-12, -5)">
            <circle cx="10" cy="8" r="4"/>
            <path d="M 2,20 C 2,14 5,10 10,10 C 15,10 18,14 18,20"/>
            <line x1="22" y1="12" x2="22" y2="18"/>
            <line x1="19" y1="15" x2="25" y2="15"/>
        </g>
    </g>

    <!-- Bottom Icons: Help & Privacy -->
    <g transform="translate(150, 160)">
        <!-- Help Icon -->
        <g class="icon-stroke">
            <circle cx="12" cy="12" r="10"/>
            <path d="M 9,9 C 9,6 15,6 15,9 C 15,11 12,11 12,14"/>
            <circle cx="12" cy="18" r="0.5" fill="#334155"/>
        </g>

        <!-- Vertical Separator -->
        <line class="separator" x1="100" y1="-5" x2="100" y2="25"/>

        <!-- Privacy/Shield Icon -->
        <g class="icon-stroke" transform="translate(180, -2)">
            <path d="M 12,2 L 2,6 L 2,14 C 2,21 12,26 12,26 C 12,26 22,21 22,14 L 22,6 Z"/>
            <polyline points="7,13 10,16 17,9"/>
        </g>
    </g>
</svg>