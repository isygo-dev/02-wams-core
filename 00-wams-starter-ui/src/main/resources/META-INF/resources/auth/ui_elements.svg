<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
    <defs>
        <style>
            .card-bg { fill: #FFFFFF; }
            .card-shadow { fill: rgba(0,0,0,0.08); filter: blur(10px); }
            .input-border { fill: none; stroke: #CBD5E1; stroke-width: 1.5; }
            .btn-bg { fill: #007B7F; }
            .divider { stroke: #CBD5E1; stroke-width: 1; }
        </style>
    </defs>

    <!-- Right Background Accent Shape -->
    <path d="M400,700 L500,700 L500,550 Z" fill="#5C9E9B" opacity="0.8"/>

    <!-- Login Card Shadow -->
    <rect class="card-shadow" x="40" y="40" width="420" height="620" rx="15"/>

    <!-- Login Card Background -->
    <rect class="card-bg" x="40" y="40" width="420" height="620" rx="15"/>

    <!-- Input Fields (3) -->
    <rect class="input-border" x="70" y="290" width="360" height="45" rx="6"/>
    <rect class="input-border" x="70" y="380" width="360" height="45" rx="6"/>
    <rect class="input-border" x="70" y="470" width="360" height="45" rx="6"/>

    <!-- Primary Button -->
    <rect class="btn-bg" x="70" y="550" width="360" height="45" rx="6"/>

    <!-- Dividers -->
    <line class="divider" x1="70" y1="190" x2="150" y2="190"/>
    <line class="divider" x1="350" y1="190" x2="430" y2="190"/>

    <line class="divider" x1="70" y1="640" x2="150" y2="640"/>
    <line class="divider" x1="350" y1="640" x2="430" y2="640"/>
</svg>