plan.error.invalid.request=The planning request is invalid.
plan.error.unknown.constraint=The requested constraint type is not supported.
plan.error.unknown.objective=The requested objective type is not supported.
plan.error.unknown.solver=The requested solver is not supported.
plan.error.infeasible=The planning problem is infeasible.
plan.error.job.not.found=The planning job was not found.
plan.error.job.queue.unavailable=The planning job could not be queued. Please retry later.
plan.error.invalid.solver.result=The solver returned an invalid planning result.
plan.error.limit.exceeded=The planning request exceeds a configured service limit.
plan.error.solver.busy=All solvers are busy. Please retry later.
plan.error.solver.unavailable=The requested solver is not available on this node.
plan.error.time.not.aligned=A time point is not aligned to the tick grid of the planning horizon, or lies outside it.
plan.error.objective.score.out.of.range=The objective values exceed the supported numeric range. Reduce the objective scale, weights or costs.
plan.error.params.invalid=The parameters of a constraint or objective are invalid (unknown, missing or malformed property).
plan.error.unsupported.schema.version=The schema version of the request is not supported: use version 2.0.
plan.error.invalid.timezone=The time zone is not a valid IANA zone id.
plan.error.invalid.horizon=The planning horizon is missing or invalid: the end must be after the start, and the tick length must divide both one day and the horizon length.
plan.error.horizon.too.large=The planning horizon contains too many ticks. Use a coarser tick length or a shorter horizon.
plan.error.time.out.of.horizon=A time point lies outside the planning horizon.
plan.error.duplicate.id=An identifier is blank or used more than once.
plan.error.missing.required.field=A required field is missing.
plan.error.unknown.reference=An identifier refers to an entity that does not exist in the request.
plan.error.invalid.duration=A duration is invalid: it is negative or longer than the horizon.
plan.error.duration.required=A duration is required: it can only be omitted when all start slots of the task have the same length.
plan.error.invalid.capacity=A resource capacity must be at least 1.
plan.error.invalid.demand=A demand or an amount must be at least 1.
plan.error.invalid.requirement=A resource requirement is invalid: check the count, the amount, duplicate roles and per-resource durations.
plan.error.invalid.lag=A precedence lag is invalid: it is out of range, or the maximum lag is smaller than the minimum lag.
plan.error.precedence.cycle=The task precedences contain a cycle.
plan.error.precedence.self.reference=A task cannot be its own predecessor.
plan.error.calendar.invalid=A calendar definition is invalid: check its windows, recurring rules, validity range and time zone.
plan.error.window.impossible=A task cannot fit between its release time and its deadline.
plan.error.setup.matrix.invalid=A setup matrix is invalid: a setup time is negative, or a class is unknown or unused.
plan.error.setup.resource.not.unary=A resource that has a setup matrix must have a capacity of 1.
plan.error.setup.too.large=The setup matrices produce too many transitions. Reduce the number of tasks per resource or the number of setup classes.
plan.error.invalid.scope=The scope of a constraint or objective does not match its type.
plan.error.invalid.enforcement=The enforcement mode is not supported by this constraint type.
plan.error.invalid.tier=A tier is out of range: allowed values are 0 to 7.
plan.error.invalid.weight=A weight is invalid: soft constraints need a weight of at least 1 and objective weights cannot be negative.
plan.error.min.rest.resource.not.unary=The minimum rest constraint only applies to resources with a capacity of 1.
plan.error.engine.unsupported.feature=The selected solver does not support a feature used by the request.
plan.error.engine.unsupported.constraint=The selected solver does not support a constraint type used by the request.
plan.error.engine.unsupported.enforcement=The selected solver does not support the enforcement mode of a constraint.
plan.error.engine.unsupported.objective=The selected solver does not support an objective type used by the request.
plan.error.overlapping.slots=The selected solver requires start slots that do not overlap.
plan.error.pairwise.too.large=A constraint would generate too many task pairs. Narrow its scope or reduce the number of tasks.
plan.error.model.too.large=The planning model is too large for this service. Reduce the number of tasks, resources or constraints, or use a coarser tick.
plan.error.invalid.initial.solution=The initial solution is invalid: it names an unknown task or resource, or a locked value lies outside the allowed domain.
plan.error.invalid.solver.model=The solver could not build a valid model from the request.
plan.error.tenant.required=The tenant of the caller could not be determined.
plan.error.tenant.mismatch=The tenant of the request does not match the authenticated tenant.
plan.error.invalid.export.format=The export format is not supported: use json or csv.
plan.error.invalid.export.section=The export section is not supported: use assignments, resources, unassigned, selected, violations, relaxations, core or metrics.
plan.warning.calendar.overlap=Overlapping calendar windows were merged.
plan.warning.calendar.rounded=A calendar bound was rounded to the tick grid: availability shrinks and unavailability grows.
plan.warning.calendar.empty=A resource has no availability inside the horizon and will not receive any task.
plan.warning.out.of.horizon.clipped=A value outside the planning horizon was clipped to the horizon.
plan.warning.hint.out.of.domain=A start or resource hint of the initial solution lies outside the allowed domain and is ignored.
plan.constraint.task_eligibility.description=Restricts the resources and start slots the scoped tasks may use (skills, ids, types, exclusions).
plan.constraint.resource_capacity.description=Lowers the capacity of the scoped resources, optionally inside a time window.
plan.constraint.no_overlap.description=Tasks of the same group, for example a class or a patient, never overlap in time; an optional minimum gap can be required.
plan.constraint.precedence.description=Orders sets of tasks with finish-start, start-start, finish-finish or start-finish links and optional lags.
plan.constraint.time_window.description=Limits the earliest and latest start and end of the scoped tasks.
plan.constraint.resource_availability.description=Blocks time intervals for the scoped resources, or allows them only inside given windows.
plan.constraint.max_consecutive.description=A resource works at most a given number of consecutive periods (days, weeks or ticks).
plan.constraint.min_rest.description=Minimum rest between two consecutive tasks of the same resource.
plan.constraint.max_load_per_period.description=Upper and lower bounds of the load of a resource per period, measured in time or in number of tasks.
plan.constraint.multi_resource_requirement.description=Adds or replaces a resource requirement (role, selector, count, amount) on every scoped task.
plan.constraint.same_resource.description=Tasks of the same group use the same resource.
plan.constraint.different_resource.description=Tasks of the same group use pairwise different resources.
plan.constraint.fixed_assignment.description=Fixes the start and/or the resources of the scoped tasks.
plan.constraint.forbidden_pair.description=Two tasks never share a resource or never overlap, or two resources never work together on the same task.
plan.constraint.max_tasks_per_resource.description=Bounds the number of tasks a resource takes, over the whole horizon or per period.
plan.objective.minimize_makespan.description=Minimizes the end time of the last task.
plan.objective.minimize_total_tardiness.description=Minimizes the total lateness of tasks that finish after their due date, optionally weighted by priority.
plan.objective.minimize_max_tardiness.description=Minimizes the largest lateness of any task.
plan.objective.minimize_resource_cost.description=Minimizes the cost of the used resources (cost per tick and cost per use).
plan.objective.minimize_slot_cost.description=Minimizes the total cost of the slots chosen as task starts.
plan.objective.maximize_task_priority.description=Prefers selecting the optional tasks with the highest priority.
plan.objective.maximize_selected_value.description=Maximizes the total prize of the selected optional tasks.
plan.objective.minimize_max_load.description=Minimizes the load of the most loaded resource (fairness).
plan.objective.balance_load.description=Minimizes the spread between the most and the least loaded resource.
plan.objective.minimize_idle.description=Minimizes the idle time of the resources between their first and their last task.
plan.objective.minimize_setup.description=Minimizes the total setup time between consecutive tasks of a resource.
plan.objective.minimize_preference_penalty.description=Minimizes the penalties of the violated task preferences (preferred resource or preferred start).
plan.objective.minimize_plan_changes.description=Minimizes the deviation from the initial solution (moved starts and changed resources).
