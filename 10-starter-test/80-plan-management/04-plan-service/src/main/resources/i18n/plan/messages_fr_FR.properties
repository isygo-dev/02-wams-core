plan.error.invalid.request=La demande de planification est invalide.
plan.error.unknown.constraint=Le type de contrainte demandé n'est pas pris en charge.
plan.error.unknown.objective=Le type d'objectif demandé n'est pas pris en charge.
plan.error.unknown.solver=Le solveur demandé n'est pas pris en charge.
plan.error.infeasible=Le problème de planification est irréalisable.
plan.error.job.not.found=Le travail de planification est introuvable.
plan.error.job.queue.unavailable=Le travail de planification n'a pas pu être mis en file. Veuillez réessayer plus tard.
plan.error.invalid.solver.result=Le solveur a renvoyé un résultat de planification invalide.
plan.error.limit.exceeded=La requête de planification dépasse une limite configurée du service.
plan.error.solver.busy=Tous les solveurs sont occupés. Veuillez réessayer plus tard.
plan.error.solver.unavailable=Le solveur demandé n'est pas disponible sur ce nœud.
plan.error.time.not.aligned=Un instant n'est pas aligné sur la grille de ticks de l'horizon de planification, ou se situe en dehors de celui-ci.
plan.error.objective.score.out.of.range=Les valeurs de l'objectif dépassent la plage numérique prise en charge. Réduisez l'échelle, les poids ou les coûts de l'objectif.
plan.error.params.invalid=Les paramètres d'une contrainte ou d'un objectif sont invalides (propriété inconnue, manquante ou mal formée).
plan.error.unsupported.schema.version=La version de schéma de la requête n'est pas prise en charge : utilisez la version 2.0.
plan.error.invalid.timezone=Le fuseau horaire n'est pas un identifiant de zone IANA valide.
plan.error.invalid.horizon=L'horizon de planification est absent ou invalide : la fin doit suivre le début, et la durée du tick doit diviser à la fois une journée et la durée de l'horizon.
plan.error.horizon.too.large=L'horizon de planification contient trop de ticks. Utilisez un tick plus grossier ou un horizon plus court.
plan.error.time.out.of.horizon=Un instant se situe en dehors de l'horizon de planification.
plan.error.duplicate.id=Un identifiant est vide ou utilisé plusieurs fois.
plan.error.missing.required.field=Un champ obligatoire est manquant.
plan.error.unknown.reference=Un identifiant fait référence à une entité qui n'existe pas dans la requête.
plan.error.invalid.duration=Une durée est invalide : elle est négative ou plus longue que l'horizon.
plan.error.duration.required=Une durée est requise : elle ne peut être omise que si tous les créneaux de départ de la tâche ont la même longueur.
plan.error.invalid.capacity=La capacité d'une ressource doit être au moins égale à 1.
plan.error.invalid.demand=Une demande ou une quantité doit être au moins égale à 1.
plan.error.invalid.requirement=Une exigence de ressource est invalide : vérifiez le nombre, la quantité, les rôles en double et les durées par ressource.
plan.error.invalid.lag=Un décalage de précédence est invalide : il est hors limites, ou le décalage maximal est inférieur au décalage minimal.
plan.error.precedence.cycle=Les précédences des tâches contiennent un cycle.
plan.error.precedence.self.reference=Une tâche ne peut pas être son propre prédécesseur.
plan.error.calendar.invalid=Une définition de calendrier est invalide : vérifiez ses fenêtres, ses règles récurrentes, sa période de validité et son fuseau horaire.
plan.error.window.impossible=Une tâche ne peut pas tenir entre sa date de disponibilité et son échéance.
plan.error.setup.matrix.invalid=Une matrice de changement est invalide : un temps de changement est négatif, ou une classe est inconnue ou inutilisée.
plan.error.setup.resource.not.unary=Une ressource qui possède une matrice de changement doit avoir une capacité de 1.
plan.error.setup.too.large=Les matrices de changement produisent trop de transitions. Réduisez le nombre de tâches par ressource ou le nombre de classes de changement.
plan.error.invalid.scope=La portée d'une contrainte ou d'un objectif ne correspond pas à son type.
plan.error.invalid.enforcement=Le mode d'application n'est pas pris en charge par ce type de contrainte.
plan.error.invalid.tier=Un niveau est hors limites : les valeurs autorisées vont de 0 à 7.
plan.error.invalid.weight=Un poids est invalide : les contraintes souples exigent un poids d'au moins 1 et les poids d'objectif ne peuvent pas être négatifs.
plan.error.min.rest.resource.not.unary=La contrainte de repos minimal ne s'applique qu'aux ressources ayant une capacité de 1.
plan.error.engine.unsupported.feature=Le solveur sélectionné ne prend pas en charge une fonctionnalité utilisée par la requête.
plan.error.engine.unsupported.constraint=Le solveur sélectionné ne prend pas en charge un type de contrainte utilisé par la requête.
plan.error.engine.unsupported.enforcement=Le solveur sélectionné ne prend pas en charge le mode d'application d'une contrainte.
plan.error.engine.unsupported.objective=Le solveur sélectionné ne prend pas en charge un type d'objectif utilisé par la requête.
plan.error.overlapping.slots=Le solveur sélectionné exige des créneaux de départ qui ne se chevauchent pas.
plan.error.pairwise.too.large=Une contrainte générerait trop de paires de tâches. Restreignez sa portée ou réduisez le nombre de tâches.
plan.error.model.too.large=Le modèle de planification est trop grand pour ce service. Réduisez le nombre de tâches, de ressources ou de contraintes, ou utilisez un tick plus grossier.
plan.error.invalid.initial.solution=La solution initiale est invalide : elle cite une tâche ou une ressource inconnue, ou une valeur verrouillée se situe hors du domaine autorisé.
plan.error.invalid.solver.model=Le solveur n'a pas pu construire un modèle valide à partir de la requête.
plan.error.tenant.required=Le locataire de l'appelant n'a pas pu être déterminé.
plan.error.tenant.mismatch=Le locataire de la requête ne correspond pas au locataire authentifié.
plan.error.invalid.export.format=Le format d'export n'est pas pris en charge : utilisez json ou csv.
plan.error.invalid.export.section=La section d'export n'est pas prise en charge : utilisez assignments, resources, unassigned, selected, violations, relaxations, core ou metrics.
plan.warning.calendar.overlap=Des fenêtres de calendrier qui se chevauchent ont été fusionnées.
plan.warning.calendar.rounded=Une borne de calendrier a été arrondie à la grille de ticks : la disponibilité diminue et l'indisponibilité augmente.
plan.warning.calendar.empty=Une ressource n'a aucune disponibilité dans l'horizon et ne recevra aucune tâche.
plan.warning.out.of.horizon.clipped=Une valeur située en dehors de l'horizon de planification a été ramenée à l'horizon.
plan.warning.hint.out.of.domain=Une suggestion de début ou de ressource de la solution initiale se situe hors du domaine autorisé et est ignorée.
plan.constraint.task_eligibility.description=Restreint les ressources et les créneaux de départ que les tâches ciblées peuvent utiliser (compétences, identifiants, types, exclusions).
plan.constraint.resource_capacity.description=Réduit la capacité des ressources ciblées, éventuellement dans une fenêtre de temps.
plan.constraint.no_overlap.description=Les tâches d'un même groupe, par exemple une classe ou un patient, ne se chevauchent jamais dans le temps ; un écart minimal peut être exigé.
plan.constraint.precedence.description=Ordonne des ensembles de tâches avec des liens fin-début, début-début, fin-fin ou début-fin et des décalages optionnels.
plan.constraint.time_window.description=Limite le début et la fin au plus tôt et au plus tard des tâches ciblées.
plan.constraint.resource_availability.description=Bloque des intervalles de temps pour les ressources ciblées, ou ne les autorise que dans des fenêtres données.
plan.constraint.max_consecutive.description=Une ressource travaille au plus un nombre donné de périodes consécutives (jours, semaines ou ticks).
plan.constraint.min_rest.description=Repos minimal entre deux tâches consécutives d'une même ressource.
plan.constraint.max_load_per_period.description=Bornes supérieure et inférieure de la charge d'une ressource par période, mesurée en temps ou en nombre de tâches.
plan.constraint.multi_resource_requirement.description=Ajoute ou remplace une exigence de ressource (rôle, sélecteur, nombre, quantité) sur chaque tâche ciblée.
plan.constraint.same_resource.description=Les tâches d'un même groupe utilisent la même ressource.
plan.constraint.different_resource.description=Les tâches d'un même groupe utilisent des ressources deux à deux différentes.
plan.constraint.fixed_assignment.description=Fixe le début et/ou les ressources des tâches ciblées.
plan.constraint.forbidden_pair.description=Deux tâches ne partagent jamais une ressource ou ne se chevauchent jamais, ou deux ressources ne travaillent jamais ensemble sur la même tâche.
plan.constraint.max_tasks_per_resource.description=Borne le nombre de tâches qu'une ressource prend, sur tout l'horizon ou par période.
plan.objective.minimize_makespan.description=Minimise l'heure de fin de la dernière tâche.
plan.objective.minimize_total_tardiness.description=Minimise le retard total des tâches qui se terminent après leur date d'échéance, éventuellement pondéré par la priorité.
plan.objective.minimize_max_tardiness.description=Minimise le plus grand retard de toutes les tâches.
plan.objective.minimize_resource_cost.description=Minimise le coût des ressources utilisées (coût par tick et coût par utilisation).
plan.objective.minimize_slot_cost.description=Minimise le coût total des créneaux choisis comme débuts de tâches.
plan.objective.maximize_task_priority.description=Privilégie la sélection des tâches optionnelles de plus haute priorité.
plan.objective.maximize_selected_value.description=Maximise la prime totale des tâches optionnelles sélectionnées.
plan.objective.minimize_max_load.description=Minimise la charge de la ressource la plus chargée (équité).
plan.objective.balance_load.description=Minimise l'écart entre la ressource la plus chargée et la moins chargée.
plan.objective.minimize_idle.description=Minimise le temps d'inactivité des ressources entre leur première et leur dernière tâche.
plan.objective.minimize_setup.description=Minimise le temps de changement total entre les tâches consécutives d'une ressource.
plan.objective.minimize_preference_penalty.description=Minimise les pénalités des préférences de tâches non respectées (ressource ou début préféré).
plan.objective.minimize_plan_changes.description=Minimise l'écart par rapport à la solution initiale (débuts déplacés et ressources modifiées).
conflict.exception=L'opération est en conflit avec l'état actuel de la ressource.
operation.not.supported.exception=Cette opération n'est pas prise en charge.
operation.not.allowed.exception=Cette opération n'est pas autorisée dans l'état actuel.
object.not.found.exception=L'objet demandé est introuvable.
object.already.exists.exception=Un objet avec le même identifiant existe déjà.
bad.argument.exception=L'argument fourni est invalide.
bad.request.exception=La requête est invalide.
empty.list.exception=La liste fournie ne doit pas être vide.
null.identifier.exception=L'identifiant ne doit pas être nul.
