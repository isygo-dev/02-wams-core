plan.error.time.not.aligned=Un istante non è allineato alla griglia di tick dell'orizzonte di pianificazione oppure si trova al di fuori di esso.
plan.error.objective.score.out.of.range=I valori dell'obiettivo superano l'intervallo numerico supportato. Riduci la scala, i pesi o i costi dell'obiettivo.
plan.error.params.invalid=I parametri di un vincolo o di un obiettivo non sono validi (proprietà sconosciuta, mancante o malformata).
plan.error.unsupported.schema.version=La versione dello schema della richiesta non è supportata: usare la versione 2.0.
plan.error.invalid.timezone=Il fuso orario non è un identificatore di zona IANA valido.
plan.error.invalid.horizon=L'orizzonte di pianificazione manca o non è valido: la fine deve seguire l'inizio e la durata del tick deve dividere sia un giorno sia la lunghezza dell'orizzonte.
plan.error.horizon.too.large=L'orizzonte di pianificazione contiene troppi tick. Usare un tick più grande o un orizzonte più breve.
plan.error.time.out.of.horizon=Un istante si trova al di fuori dell'orizzonte di pianificazione.
plan.error.duplicate.id=Un identificatore è vuoto o usato più di una volta.
plan.error.missing.required.field=Manca un campo obbligatorio.
plan.error.unknown.reference=Un identificatore fa riferimento a un'entità che non esiste nella richiesta.
plan.error.invalid.duration=Una durata non è valida: è negativa o più lunga dell'orizzonte.
plan.error.duration.required=Una durata è obbligatoria: può essere omessa solo se tutti gli slot di inizio dell'attività hanno la stessa lunghezza.
plan.error.invalid.capacity=La capacità di una risorsa deve essere almeno 1.
plan.error.invalid.demand=Una richiesta o una quantità deve essere almeno 1.
plan.error.invalid.requirement=Un requisito di risorsa non è valido: verificare il numero, la quantità, i ruoli duplicati e le durate per risorsa.
plan.error.invalid.lag=Uno scostamento di precedenza non è valido: è fuori intervallo oppure lo scostamento massimo è inferiore al minimo.
plan.error.precedence.cycle=Le precedenze delle attività contengono un ciclo.
plan.error.precedence.self.reference=Un'attività non può essere la propria predecessora.
plan.error.calendar.invalid=La definizione di un calendario non è valida: verificare finestre, regole ricorrenti, intervallo di validità e fuso orario.
plan.error.window.impossible=Un'attività non può essere contenuta tra la sua data di rilascio e la sua scadenza.
plan.error.setup.matrix.invalid=Una matrice di setup non è valida: un tempo di setup è negativo oppure una classe è sconosciuta o inutilizzata.
plan.error.setup.resource.not.unary=Una risorsa che ha una matrice di setup deve avere una capacità pari a 1.
plan.error.setup.too.large=Le matrici di setup producono troppe transizioni. Ridurre il numero di attività per risorsa o di classi di setup.
plan.error.invalid.scope=L'ambito di un vincolo o di un obiettivo non corrisponde al suo tipo.
plan.error.invalid.enforcement=La modalità di applicazione non è supportata da questo tipo di vincolo.
plan.error.invalid.tier=Un livello è fuori intervallo: i valori ammessi vanno da 0 a 7.
plan.error.invalid.weight=Un peso non è valido: i vincoli soft richiedono un peso di almeno 1 e i pesi degli obiettivi non possono essere negativi.
plan.error.min.rest.resource.not.unary=Il vincolo di riposo minimo si applica solo alle risorse con capacità pari a 1.
plan.error.engine.unsupported.feature=Il solver selezionato non supporta una funzionalità usata dalla richiesta.
plan.error.engine.unsupported.constraint=Il solver selezionato non supporta un tipo di vincolo usato dalla richiesta.
plan.error.engine.unsupported.enforcement=Il solver selezionato non supporta la modalità di applicazione di un vincolo.
plan.error.engine.unsupported.objective=Il solver selezionato non supporta un tipo di obiettivo usato dalla richiesta.
plan.error.overlapping.slots=Il solver selezionato richiede slot di inizio che non si sovrappongano.
plan.error.pairwise.too.large=Un vincolo genererebbe troppe coppie di attività. Restringere il suo ambito o ridurre il numero di attività.
plan.error.model.too.large=Il modello di pianificazione è troppo grande per questo servizio. Ridurre il numero di attività, risorse o vincoli, oppure usare un tick più grande.
plan.error.invalid.initial.solution=La soluzione iniziale non è valida: cita un'attività o una risorsa sconosciuta, oppure un valore bloccato è fuori dal dominio consentito.
plan.error.invalid.solver.model=Il solver non è riuscito a costruire un modello valido dalla richiesta.
plan.error.tenant.required=Non è stato possibile determinare il tenant del chiamante.
plan.error.tenant.mismatch=Il tenant della richiesta non corrisponde al tenant autenticato.
plan.error.invalid.export.format=Il formato di esportazione non è supportato: usare json o csv.
plan.error.invalid.export.section=La sezione di esportazione non è supportata: usare assignments, resources, unassigned, selected, violations, relaxations, core o metrics.
plan.warning.calendar.overlap=Le finestre di calendario sovrapposte sono state unite.
plan.warning.calendar.rounded=Un limite di calendario è stato arrotondato alla griglia dei tick: la disponibilità si riduce e l'indisponibilità aumenta.
plan.warning.calendar.empty=Una risorsa non ha disponibilità nell'orizzonte e non riceverà alcuna attività.
plan.warning.out.of.horizon.clipped=Un valore al di fuori dell'orizzonte di pianificazione è stato ridotto all'orizzonte.
plan.warning.hint.out.of.domain=Un suggerimento di inizio o di risorsa della soluzione iniziale è fuori dal dominio consentito e viene ignorato.
plan.constraint.task_eligibility.description=Limita le risorse e gli slot di inizio utilizzabili dalle attività nell'ambito (competenze, identificatori, tipi, esclusioni).
plan.constraint.resource_capacity.description=Riduce la capacità delle risorse nell'ambito, facoltativamente all'interno di una finestra temporale.
plan.constraint.no_overlap.description=Le attività dello stesso gruppo, ad esempio una classe o un paziente, non si sovrappongono mai nel tempo; si può richiedere un intervallo minimo.
plan.constraint.precedence.description=Ordina insiemi di attività con legami fine-inizio, inizio-inizio, fine-fine o inizio-fine e scostamenti facoltativi.
plan.constraint.time_window.description=Limita l'inizio e la fine più anticipati e più tardivi delle attività nell'ambito.
plan.constraint.resource_availability.description=Blocca intervalli di tempo per le risorse nell'ambito, oppure li consente solo all'interno di finestre date.
plan.constraint.max_consecutive.description=Una risorsa lavora al massimo per un numero dato di periodi consecutivi (giorni, settimane o tick).
plan.constraint.min_rest.description=Riposo minimo tra due attività consecutive della stessa risorsa.
plan.constraint.max_load_per_period.description=Limiti superiore e inferiore del carico di una risorsa per periodo, misurato in tempo o in numero di attività.
plan.constraint.multi_resource_requirement.description=Aggiunge o sostituisce un requisito di risorsa (ruolo, selettore, numero, quantità) su ogni attività nell'ambito.
plan.constraint.same_resource.description=Le attività dello stesso gruppo usano la stessa risorsa.
plan.constraint.different_resource.description=Le attività dello stesso gruppo usano risorse a due a due diverse.
plan.constraint.fixed_assignment.description=Fissa l'inizio e/o le risorse delle attività nell'ambito.
plan.constraint.forbidden_pair.description=Due attività non condividono mai una risorsa o non si sovrappongono mai, oppure due risorse non lavorano mai insieme sulla stessa attività.
plan.constraint.max_tasks_per_resource.description=Limita il numero di attività assunte da una risorsa, sull'intero orizzonte o per periodo.
plan.objective.minimize_makespan.description=Minimizza l'ora di fine dell'ultima attività.
plan.objective.minimize_total_tardiness.description=Minimizza il ritardo totale delle attività che terminano dopo la scadenza, facoltativamente pesato per priorità.
plan.objective.minimize_max_tardiness.description=Minimizza il ritardo massimo di qualsiasi attività.
plan.objective.minimize_resource_cost.description=Minimizza il costo delle risorse utilizzate (costo per tick e costo per utilizzo).
plan.objective.minimize_slot_cost.description=Minimizza il costo totale degli slot scelti come inizio delle attività.
plan.objective.maximize_task_priority.description=Privilegia la selezione delle attività facoltative con la priorità più alta.
plan.objective.maximize_selected_value.description=Massimizza il premio totale delle attività facoltative selezionate.
plan.objective.minimize_max_load.description=Minimizza il carico della risorsa più carica (equità).
plan.objective.balance_load.description=Minimizza la differenza tra la risorsa più carica e quella meno carica.
plan.objective.minimize_idle.description=Minimizza il tempo di inattività delle risorse tra la prima e l'ultima attività.
plan.objective.minimize_setup.description=Minimizza il tempo totale di setup tra attività consecutive di una risorsa.
plan.objective.minimize_preference_penalty.description=Minimizza le penalità delle preferenze di attività violate (risorsa o inizio preferito).
plan.objective.minimize_plan_changes.description=Minimizza lo scostamento dalla soluzione iniziale (inizi spostati e risorse cambiate).
