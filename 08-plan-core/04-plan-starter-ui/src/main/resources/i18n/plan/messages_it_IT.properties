plan.error.invalid.solver.result=Il solver ha restituito un risultato di pianificazione non valido.
plan.error.limit.exceeded=La richiesta di pianificazione supera un limite configurato del servizio.
plan.error.solver.busy=Tutti i solver sono occupati. Riprovare più tardi.
