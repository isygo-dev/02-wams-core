plan.error.missing.required.field=Ein Pflichtfeld fehlt.
plan.error.unknown.reference=Eine Kennung verweist auf eine Entität, die in der Anfrage nicht existiert.
plan.error.invalid.duration=Eine Dauer ist ungültig: Sie ist negativ oder länger als der Horizont.
plan.error.duration.required=Eine Dauer ist erforderlich: Sie darf nur entfallen, wenn alle Startslots der Aufgabe gleich lang sind.
plan.error.invalid.capacity=Die Kapazität einer Ressource muss mindestens 1 betragen.
plan.error.invalid.demand=Ein Bedarf oder eine Menge muss mindestens 1 betragen.
plan.error.invalid.requirement=Eine Ressourcenanforderung ist ungültig: Prüfen Sie Anzahl, Menge, doppelte Rollen und ressourcenspezifische Dauern.
plan.error.invalid.lag=Ein Vorgängerabstand ist ungültig: Er liegt außerhalb des Bereichs, oder der maximale Abstand ist kleiner als der minimale.
plan.error.precedence.cycle=Die Aufgabenreihenfolgen enthalten einen Zyklus.
plan.error.precedence.self.reference=Eine Aufgabe kann nicht ihr eigener Vorgänger sein.
plan.error.calendar.invalid=Eine Kalenderdefinition ist ungültig: Prüfen Sie Zeitfenster, Wiederholungsregeln, Gültigkeitszeitraum und Zeitzone.
plan.error.window.impossible=Eine Aufgabe passt nicht zwischen ihren frühesten Start und ihre Frist.
plan.error.setup.matrix.invalid=Eine Rüstmatrix ist ungültig: Eine Rüstzeit ist negativ, oder eine Klasse ist unbekannt oder ungenutzt.
plan.error.setup.resource.not.unary=Eine Ressource mit Rüstmatrix muss die Kapazität 1 haben.
plan.error.setup.too.large=Die Rüstmatrizen erzeugen zu viele Übergänge. Reduzieren Sie die Anzahl der Aufgaben pro Ressource oder der Rüstklassen.
plan.error.invalid.scope=Der Geltungsbereich einer Bedingung oder eines Ziels passt nicht zu ihrem Typ.
plan.error.invalid.enforcement=Der Durchsetzungsmodus wird von diesem Bedingungstyp nicht unterstützt.
plan.error.invalid.tier=Eine Stufe liegt außerhalb des Bereichs: Zulässig sind die Werte 0 bis 7.
plan.error.invalid.weight=Ein Gewicht ist ungültig: Weiche Bedingungen benötigen ein Gewicht von mindestens 1, und Zielgewichte dürfen nicht negativ sein.
plan.error.min.rest.resource.not.unary=Die Mindestruhezeit-Bedingung gilt nur für Ressourcen mit der Kapazität 1.
plan.error.engine.unsupported.feature=Der ausgewählte Solver unterstützt eine in der Anfrage verwendete Funktion nicht.
plan.error.engine.unsupported.constraint=Der ausgewählte Solver unterstützt einen in der Anfrage verwendeten Bedingungstyp nicht.
plan.error.engine.unsupported.enforcement=Der ausgewählte Solver unterstützt den Durchsetzungsmodus einer Bedingung nicht.
plan.error.engine.unsupported.objective=Der ausgewählte Solver unterstützt einen in der Anfrage verwendeten Zieltyp nicht.
plan.error.overlapping.slots=Der ausgewählte Solver verlangt Startslots, die sich nicht überlappen.
plan.error.pairwise.too.large=Eine Bedingung würde zu viele Aufgabenpaare erzeugen. Schränken Sie ihren Geltungsbereich ein oder verringern Sie die Anzahl der Aufgaben.
plan.error.model.too.large=Das Planungsmodell ist für diesen Dienst zu groß. Verringern Sie die Anzahl der Aufgaben, Ressourcen oder Bedingungen, oder verwenden Sie einen gröberen Tick.
plan.error.invalid.initial.solution=Die Anfangslösung ist ungültig: Sie nennt eine unbekannte Aufgabe oder Ressource, oder ein fixierter Wert liegt außerhalb des zulässigen Bereichs.
plan.error.invalid.solver.model=Der Solver konnte aus der Anfrage kein gültiges Modell erstellen.
plan.error.tenant.required=Der Mandant des Aufrufers konnte nicht ermittelt werden.
plan.error.tenant.mismatch=Der Mandant der Anfrage stimmt nicht mit dem authentifizierten Mandanten überein.
plan.error.invalid.export.format=Das Exportformat wird nicht unterstützt: Verwenden Sie json oder csv.
plan.error.invalid.export.section=Der Exportabschnitt wird nicht unterstützt: Verwenden Sie assignments, resources, unassigned, selected, violations, relaxations, core oder metrics.
plan.warning.calendar.overlap=Sich überlappende Kalenderfenster wurden zusammengeführt.
plan.warning.calendar.rounded=Eine Kalendergrenze wurde auf das Tick-Raster gerundet: Die Verfügbarkeit schrumpft, die Nichtverfügbarkeit wächst.
plan.warning.calendar.empty=Eine Ressource hat innerhalb des Horizonts keine Verfügbarkeit und erhält keine Aufgabe.
plan.warning.out.of.horizon.clipped=Ein Wert außerhalb des Planungshorizonts wurde auf den Horizont begrenzt.
plan.warning.hint.out.of.domain=Ein Start- oder Ressourcenhinweis der Anfangslösung liegt außerhalb des zulässigen Bereichs und wird ignoriert.
plan.constraint.task_eligibility.description=Beschränkt die Ressourcen und Startslots, die die betroffenen Aufgaben nutzen dürfen (Fähigkeiten, Kennungen, Typen, Ausschlüsse).
plan.constraint.resource_capacity.description=Verringert die Kapazität der betroffenen Ressourcen, optional innerhalb eines Zeitfensters.
plan.constraint.no_overlap.description=Aufgaben derselben Gruppe, zum Beispiel einer Klasse oder eines Patienten, überlappen sich zeitlich nie; ein Mindestabstand kann verlangt werden.
plan.constraint.precedence.description=Ordnet Aufgabengruppen mit Ende-Anfang-, Anfang-Anfang-, Ende-Ende- oder Anfang-Ende-Beziehungen und optionalen Abständen.
plan.constraint.time_window.description=Begrenzt den frühesten und spätesten Start und das früheste und späteste Ende der betroffenen Aufgaben.
plan.constraint.resource_availability.description=Sperrt Zeitintervalle für die betroffenen Ressourcen oder erlaubt sie nur innerhalb vorgegebener Zeitfenster.
plan.constraint.max_consecutive.description=Eine Ressource arbeitet höchstens eine bestimmte Anzahl aufeinanderfolgender Perioden (Tage, Wochen oder Ticks).
plan.constraint.min_rest.description=Mindestruhezeit zwischen zwei aufeinanderfolgenden Aufgaben derselben Ressource.
plan.constraint.max_load_per_period.description=Ober- und Untergrenzen der Auslastung einer Ressource pro Periode, gemessen in Zeit oder Aufgabenanzahl.
plan.constraint.multi_resource_requirement.description=Fügt jeder betroffenen Aufgabe eine Ressourcenanforderung (Rolle, Selektor, Anzahl, Menge) hinzu oder ersetzt sie.
plan.constraint.same_resource.description=Aufgaben derselben Gruppe verwenden dieselbe Ressource.
plan.constraint.different_resource.description=Aufgaben derselben Gruppe verwenden paarweise verschiedene Ressourcen.
plan.constraint.fixed_assignment.description=Legt den Start und/oder die Ressourcen der betroffenen Aufgaben fest.
plan.constraint.forbidden_pair.description=Zwei Aufgaben teilen nie eine Ressource oder überlappen sich nie, oder zwei Ressourcen arbeiten nie gemeinsam an derselben Aufgabe.
plan.constraint.max_tasks_per_resource.description=Begrenzt die Anzahl der Aufgaben, die eine Ressource übernimmt, über den gesamten Horizont oder pro Periode.
plan.objective.minimize_makespan.description=Minimiert das Ende der letzten Aufgabe.
plan.objective.minimize_total_tardiness.description=Minimiert die gesamte Verspätung der Aufgaben, die nach ihrem Fälligkeitsdatum enden, optional nach Priorität gewichtet.
plan.objective.minimize_max_tardiness.description=Minimiert die größte Verspätung aller Aufgaben.
plan.objective.minimize_resource_cost.description=Minimiert die Kosten der genutzten Ressourcen (Kosten pro Tick und Kosten pro Nutzung).
plan.objective.minimize_slot_cost.description=Minimiert die Gesamtkosten der als Aufgabenstart gewählten Slots.
plan.objective.maximize_task_priority.description=Bevorzugt die Auswahl der optionalen Aufgaben mit der höchsten Priorität.
plan.objective.maximize_selected_value.description=Maximiert die Gesamtprämie der ausgewählten optionalen Aufgaben.
plan.objective.minimize_max_load.description=Minimiert die Auslastung der am stärksten ausgelasteten Ressource (Fairness).
plan.objective.balance_load.description=Minimiert die Spanne zwischen der am stärksten und der am schwächsten ausgelasteten Ressource.
plan.objective.minimize_idle.description=Minimiert die Leerlaufzeit der Ressourcen zwischen ihrer ersten und ihrer letzten Aufgabe.
plan.objective.minimize_setup.description=Minimiert die gesamte Rüstzeit zwischen aufeinanderfolgenden Aufgaben einer Ressource.
plan.objective.minimize_preference_penalty.description=Minimiert die Strafen verletzter Aufgabenpräferenzen (bevorzugte Ressource oder bevorzugter Start).
plan.objective.minimize_plan_changes.description=Minimiert die Abweichung von der Anfangslösung (verschobene Starts und gewechselte Ressourcen).
