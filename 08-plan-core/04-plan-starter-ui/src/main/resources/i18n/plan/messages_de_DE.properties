plan.error.invalid.timezone=Die Zeitzone ist keine gültige IANA-Zonenkennung.
plan.error.invalid.horizon=Der Planungshorizont fehlt oder ist ungültig: Das Ende muss nach dem Beginn liegen, und die Tick-Länge muss sowohl einen Tag als auch die Länge des Horizonts teilen.
