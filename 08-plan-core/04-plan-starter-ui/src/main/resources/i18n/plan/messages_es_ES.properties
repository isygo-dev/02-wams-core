plan.error.solver.unavailable=El solucionador solicitado no está disponible en este nodo.
plan.error.time.not.aligned=Un instante no está alineado con la cuadrícula de ticks del horizonte de planificación o queda fuera de él.
plan.error.objective.score.out.of.range=Los valores del objetivo superan el rango numérico admitido. Reduzca la escala, los pesos o los costes del objetivo.
plan.error.params.invalid=Los parámetros de una restricción o de un objetivo no son válidos (propiedad desconocida, ausente o mal formada).
plan.error.unsupported.schema.version=La versión del esquema de la solicitud no es compatible: use la versión 2.0.
plan.error.invalid.timezone=La zona horaria no es un identificador de zona IANA válido.
plan.error.invalid.horizon=El horizonte de planificación falta o no es válido: el final debe ser posterior al inicio y la duración del tick debe dividir tanto un día como la longitud del horizonte.
plan.error.horizon.too.large=El horizonte de planificación contiene demasiados ticks. Use un tick más grande o un horizonte más corto.
plan.error.time.out.of.horizon=Un instante se encuentra fuera del horizonte de planificación.
plan.error.duplicate.id=Un identificador está vacío o se usa más de una vez.
plan.error.missing.required.field=Falta un campo obligatorio.
plan.error.unknown.reference=Un identificador hace referencia a una entidad que no existe en la solicitud.
plan.error.invalid.duration=Una duración no es válida: es negativa o más larga que el horizonte.
plan.error.duration.required=Se requiere una duración: solo puede omitirse si todas las franjas de inicio de la tarea tienen la misma longitud.
plan.error.invalid.capacity=La capacidad de un recurso debe ser al menos 1.
plan.error.invalid.demand=Una demanda o una cantidad debe ser al menos 1.
plan.error.invalid.requirement=Un requisito de recurso no es válido: compruebe el número, la cantidad, los roles duplicados y las duraciones por recurso.
plan.error.invalid.lag=Un desfase de precedencia no es válido: está fuera de rango o el desfase máximo es menor que el mínimo.
plan.error.precedence.cycle=Las precedencias de las tareas contienen un ciclo.
plan.error.precedence.self.reference=Una tarea no puede ser su propia predecesora.
plan.error.calendar.invalid=La definición de un calendario no es válida: compruebe sus ventanas, reglas recurrentes, rango de validez y zona horaria.
plan.error.window.impossible=Una tarea no cabe entre su fecha de liberación y su plazo límite.
plan.error.setup.matrix.invalid=Una matriz de preparación no es válida: un tiempo de preparación es negativo o una clase es desconocida o no se usa.
plan.error.setup.resource.not.unary=Un recurso que tiene una matriz de preparación debe tener una capacidad de 1.
plan.error.setup.too.large=Las matrices de preparación producen demasiadas transiciones. Reduzca el número de tareas por recurso o de clases de preparación.
plan.error.invalid.scope=El ámbito de una restricción o de un objetivo no corresponde a su tipo.
plan.error.invalid.enforcement=El modo de aplicación no es compatible con este tipo de restricción.
plan.error.invalid.tier=Un nivel está fuera de rango: los valores permitidos van de 0 a 7.
plan.error.invalid.weight=Un peso no es válido: las restricciones blandas necesitan un peso de al menos 1 y los pesos de objetivo no pueden ser negativos.
plan.error.min.rest.resource.not.unary=La restricción de descanso mínimo solo se aplica a recursos con una capacidad de 1.
plan.error.engine.unsupported.feature=El solucionador seleccionado no admite una función utilizada por la solicitud.
plan.error.engine.unsupported.constraint=El solucionador seleccionado no admite un tipo de restricción utilizado por la solicitud.
plan.error.engine.unsupported.enforcement=El solucionador seleccionado no admite el modo de aplicación de una restricción.
plan.error.engine.unsupported.objective=El solucionador seleccionado no admite un tipo de objetivo utilizado por la solicitud.
plan.error.overlapping.slots=El solucionador seleccionado requiere franjas de inicio que no se solapen.
plan.error.pairwise.too.large=Una restricción generaría demasiados pares de tareas. Restrinja su ámbito o reduzca el número de tareas.
plan.error.model.too.large=El modelo de planificación es demasiado grande para este servicio. Reduzca el número de tareas, recursos o restricciones, o use un tick más grande.
plan.error.invalid.initial.solution=La solución inicial no es válida: nombra una tarea o un recurso desconocido, o un valor bloqueado queda fuera del dominio permitido.
plan.error.invalid.solver.model=El solucionador no pudo construir un modelo válido a partir de la solicitud.
plan.error.tenant.required=No se pudo determinar el inquilino del llamante.
plan.error.tenant.mismatch=El inquilino de la solicitud no coincide con el inquilino autenticado.
plan.error.invalid.export.format=El formato de exportación no es compatible: use json o csv.
plan.error.invalid.export.section=La sección de exportación no es compatible: use assignments, resources, unassigned, selected, violations, relaxations, core o metrics.
plan.warning.calendar.overlap=Las ventanas de calendario que se solapaban se han fusionado.
plan.warning.calendar.rounded=Un límite de calendario se redondeó a la cuadrícula de ticks: la disponibilidad disminuye y la indisponibilidad aumenta.
plan.warning.calendar.empty=Un recurso no tiene disponibilidad dentro del horizonte y no recibirá ninguna tarea.
plan.warning.out.of.horizon.clipped=Un valor fuera del horizonte de planificación se recortó al horizonte.
plan.warning.hint.out.of.domain=Una sugerencia de inicio o de recurso de la solución inicial queda fuera del dominio permitido y se ignora.
plan.constraint.task_eligibility.description=Restringe los recursos y las franjas de inicio que pueden usar las tareas del ámbito (habilidades, identificadores, tipos, exclusiones).
plan.constraint.resource_capacity.description=Reduce la capacidad de los recursos del ámbito, opcionalmente dentro de una ventana de tiempo.
plan.constraint.no_overlap.description=Las tareas de un mismo grupo, por ejemplo una clase o un paciente, nunca se solapan en el tiempo; se puede exigir una separación mínima.
plan.constraint.precedence.description=Ordena conjuntos de tareas con vínculos fin-inicio, inicio-inicio, fin-fin o inicio-fin y desfases opcionales.
plan.constraint.time_window.description=Limita el inicio y el fin más tempranos y más tardíos de las tareas del ámbito.
plan.constraint.resource_availability.description=Bloquea intervalos de tiempo para los recursos del ámbito, o solo los permite dentro de ventanas dadas.
plan.constraint.max_consecutive.description=Un recurso trabaja como máximo un número dado de períodos consecutivos (días, semanas o ticks).
plan.constraint.min_rest.description=Descanso mínimo entre dos tareas consecutivas del mismo recurso.
plan.constraint.max_load_per_period.description=Límites superior e inferior de la carga de un recurso por período, medida en tiempo o en número de tareas.
plan.constraint.multi_resource_requirement.description=Agrega o reemplaza un requisito de recurso (rol, selector, número, cantidad) en cada tarea del ámbito.
plan.constraint.same_resource.description=Las tareas de un mismo grupo usan el mismo recurso.
plan.constraint.different_resource.description=Las tareas de un mismo grupo usan recursos distintos entre sí.
plan.constraint.fixed_assignment.description=Fija el inicio y/o los recursos de las tareas del ámbito.
plan.constraint.forbidden_pair.description=Dos tareas nunca comparten un recurso o nunca se solapan, o dos recursos nunca trabajan juntos en la misma tarea.
plan.constraint.max_tasks_per_resource.description=Limita el número de tareas que asume un recurso, en todo el horizonte o por período.
plan.objective.minimize_makespan.description=Minimiza la hora de finalización de la última tarea.
plan.objective.minimize_total_tardiness.description=Minimiza el retraso total de las tareas que terminan después de su fecha de vencimiento, opcionalmente ponderado por prioridad.
plan.objective.minimize_max_tardiness.description=Minimiza el mayor retraso de cualquier tarea.
plan.objective.minimize_resource_cost.description=Minimiza el coste de los recursos utilizados (coste por tick y coste por uso).
plan.objective.minimize_slot_cost.description=Minimiza el coste total de las franjas elegidas como inicio de tarea.
plan.objective.maximize_task_priority.description=Prefiere seleccionar las tareas opcionales de mayor prioridad.
plan.objective.maximize_selected_value.description=Maximiza el premio total de las tareas opcionales seleccionadas.
plan.objective.minimize_max_load.description=Minimiza la carga del recurso más cargado (equidad).
plan.objective.balance_load.description=Minimiza la diferencia entre el recurso más cargado y el menos cargado.
plan.objective.minimize_idle.description=Minimiza el tiempo ocioso de los recursos entre su primera y su última tarea.
plan.objective.minimize_setup.description=Minimiza el tiempo total de preparación entre tareas consecutivas de un recurso.
plan.objective.minimize_preference_penalty.description=Minimiza las penalizaciones de las preferencias de tarea incumplidas (recurso o inicio preferido).
plan.objective.minimize_plan_changes.description=Minimiza la desviación respecto de la solución inicial (inicios movidos y recursos cambiados).
